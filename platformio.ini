[platformio]
default_envs = nano

; ── Shared settings ───────────────────────────────────────────────────────────
[common]
platform     = atmelavr
framework    = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; ── Standard builds ───────────────────────────────────────────────────────────
[env:mega]
platform     = ${common.platform}
framework    = ${common.framework}
board        = megaatmega2560
upload_protocol = wiring
monitor_speed = ${common.monitor_speed}
lib_deps     = ${common.lib_deps}

[env:uno]
platform     = ${common.platform}
framework    = ${common.framework}
board        = uno
monitor_speed = ${common.monitor_speed}
lib_deps     = ${common.lib_deps}

[env:nano]
platform     = ${common.platform}
framework    = ${common.framework}
board        = nanoatmega328new
monitor_speed = ${common.monitor_speed}
lib_deps     = ${common.lib_deps}

[env:micro]
platform     = ${common.platform}
framework    = ${common.framework}
board        = micro
monitor_speed = ${common.monitor_speed}
lib_deps     = ${common.lib_deps}

[env:nano_buttons_only]
platform          = ${common.platform}
framework         = ${common.framework}
board             = nanoatmega328new
monitor_speed     = ${common.monitor_speed}
build_flags       = -D LIGHTWEIGHT
build_src_filter  = +<main.cpp> +<adc_reader.cpp> +<button.cpp>

[env:attiny85_buttons_only]
platform          = ${common.platform}
framework         = ${common.framework}
board             = attiny85
monitor_speed     = ${common.monitor_speed}
build_flags       = -D LIGHTWEIGHT
build_src_filter  = +<main.cpp> +<adc_reader.cpp> +<button.cpp>
