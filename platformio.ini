; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library filter
;   Advanced options: extra scripting
;
;   Please visit documentation for the other options and examples
;   https://docs.platformio.org/page/projectconf.html

[env:bbcmicrobit]
platform = nordicnrf51
board = bbcmicrobit
framework = arduino
upload_protocol = cmsis-dap

[env:bbcmicrobit-ota]
platform = nordicnrf51
board = bbcmicrobit
framework = arduino
; Custom upload command for Bluetooth OTA using nrfutil
upload_protocol = custom
upload_command = nrfutil dfu ble -pkg $SOURCE -p "YOUR_DEVICE_PORT" -n "DfuTarg"
; Alternative: use a Python script wrapper for device discovery
; upload_command = python tools/ble_ota_upload.py $SOURCE

; Build flags for DFU (optional)
build_flags = 
    -DNRF_DFU_ENABLE
    -DDFU_APP_DATA_RESERVED=0x2000

; Extra script to package firmware as DFU zip
extra_scripts = tools/dfu_packager.py
